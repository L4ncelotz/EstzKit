schema_version: 1
name: docker
category: containers
windows:
  provider: winget
  package: Docker.DockerDesktop
  version: null
depends_on: [wsl2]
install:
  strategy: package_manager
  scope: machine
verify:
  command: docker
  args: [--version]
  expect_regex: "^Docker version"
security:
  allow_scripts: false
  allow_elevation: true

schema_version: 1
name: pnpm
category: package-manager
windows:
  provider: winget
  package: pnpm.pnpm
  version: null
depends_on: [node]
install:
  strategy: package_manager
  scope: user
verify:
  command: pnpm
  args: [--version]
  expect_regex: "^\\d+"
security:
  allow_scripts: false
  allow_elevation: false

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain pinned via rust-toolchain.toml (channel 1.99).
      # dtolnay/rust-toolchain makes the pin explicit in CI logs.
      - uses: dtolnay/rust-toolchain@1.99
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # No Cargo.lock is committed yet (binary lockfile arrives with the first
      # green run, then gets committed so subsequent --locked runs are exact).
      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: cargo build (core + cli only)
        run: cargo build -p estzkit-core -p estzkit-cli --locked

      - name: cargo test (core)
        run: cargo test -p estzkit-core --locked

      - name: Publish Cargo.lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cargo-lock
          path: Cargo.lock

      - name: CLI smoke — bundled manifests (read-only)
        run: |
          cargo run -p estzkit-cli -- packages
          cargo run -p estzkit-cli -- profiles
          cargo run -p estzkit-cli -- detect
          cargo run -p estzkit-cli -- plan node git docker

      # Frontend checks (mirrors local verification).
      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      - name: validate manifests against JSON Schemas
        run: corepack pnpm run validate:manifests

      - name: TypeScript typecheck
        run: corepack pnpm run typecheck

      - name: build frontend
        run: corepack pnpm run build

  installer:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Enable corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build
      - name: Build Tauri installer
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc
      - name: Upload installer bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: estzkit-installer
          path: |
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe

  e2e:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo build
        run: cargo build -p estzkit-core -p estzkit-cli --locked
      - name: Real install on disposable runner
        run: |
          cargo run -p estzkit-cli -- install git node
      - name: Verify installed tools via CLI detect
        shell: pwsh
        run: |
          cargo run -p estzkit-cli -- detect | Out-File -FilePath detect-output.txt -Encoding utf8
          Get-Content detect-output.txt
          $content = Get-Content detect-output.txt -Raw
          if (-not ($content -match "(?m)^git\s+true")) {
            throw "Expected git to be detected as true"
          }
          if (-not ($content -match "(?m)^node\s+true")) {
            throw "Expected node to be detected as true"
          }
          "install_exit=0" | Out-File -FilePath exit-codes.txt -Encoding utf8
          "detect_exit=0" | Out-File -FilePath exit-codes.txt -Append -Encoding utf8
      - name: Upload E2E evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            detect-output.txt
            exit-codes.txt

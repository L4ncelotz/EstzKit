[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
ts-rs = { version = "10", features = ["serde-compat"] }
winreg = "0.52"

[workspace.package]
edition = "2021"
rust-version = "1.95"
